<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIKI Magazine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  :root {
    --ink: #17181a;
    --bg: #ffffff;
    --bg-alt: #f6f6f6;
    --hot: #ff2e88;
    --violet: #7a4ea0;
    --amber: #a66b00;
    --muted: #5a5a5a;
    --rule: #e2e2e2;
    --maxw: 700px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  img { max-width: 100%; display: block; }

  /* ---------- Header ---------- */

  .topbar { background: var(--ink); }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 6px 20px;
    font-size: 0.78rem; color: rgba(255,255,255,0.75); font-weight: 500;
  }

  .site-header { background: var(--bg); border-bottom: 1px solid var(--rule); }
  .header-inner {
    max-width: 1180px; margin: 0 auto; padding: 16px 20px 0;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand-block {
    background: var(--hot); color: #fff; font-weight: 800; font-size: 1.15rem;
    letter-spacing: 0.01em; padding: 5px 9px; line-height: 1;
  }
  .brand-word {
    font-weight: 800; font-size: 1.1rem; letter-spacing: 0.02em; color: var(--ink);
  }

  .nav {
    max-width: 1180px; margin: 0 auto; padding: 0 20px;
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .nav a {
    display: inline-block; padding: 12px 14px; font-size: 0.92rem; font-weight: 700;
    color: var(--ink); text-decoration: none; border-bottom: 3px solid transparent;
    margin-bottom: -1px;
  }
  .nav a:hover { text-decoration: none; background: var(--bg-alt); }
  .nav a.active { border-bottom-color: var(--hot); }

  /* ---------- Layout wrappers ---------- */

  .page { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .article-col { max-width: var(--maxw); margin: 0 auto; }

  .section-heading {
    font-size: 1.3rem; font-weight: 800; margin: 40px 0 16px;
    padding-bottom: 10px; border-bottom: 4px solid var(--ink);
  }

  /* ---------- Category colours ---------- */

  .cat-dragrace { --cat: var(--hot); }
  .cat-lgbtq { --cat: var(--violet); }
  .cat-generaldrag { --cat: var(--amber); }

  .tag {
    display: inline-block; font-size: 0.72rem; font-weight: 800;
    letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--cat, var(--hot)); margin-bottom: 6px;
  }

  /* ---------- Story grid ---------- */

  .story-grid {
    display: grid; grid-template-columns: repeat(12, 1fr);
    gap: 0; border-top: 1px solid var(--rule);
  }

  .card {
    display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
    padding: 20px; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule);
  }
  .card:hover .card-title { text-decoration: underline; }
  .card-media { width: 100%; aspect-ratio: 16/9; overflow: hidden; margin-bottom: 12px; background: var(--bg-alt); }
  .card-media img { width: 100%; height: 100%; object-fit: cover; }
  .card-media.no-image { display: flex; align-items: center; justify-content: center; }
  .card-media.no-image::after {
    content: "KIKI"; font-weight: 800; font-size: 0.85rem; letter-spacing: 0.05em;
    color: color-mix(in srgb, var(--cat, var(--hot)) 55%, var(--muted));
  }

  .card-title { font-weight: 800; line-height: 1.25; margin: 0 0 8px; }
  .card-standfirst { color: var(--muted); font-size: 0.92rem; margin: 0 0 8px; }
  .card-meta { color: var(--muted); font-size: 0.78rem; margin-top: auto; }

  .card--mega { grid-column: span 12; padding: 28px 20px; }
  .card--mega .card-media { aspect-ratio: 21/9; }
  .card--mega .card-title { font-size: clamp(1.7rem, 3.4vw, 2.5rem); max-width: 26ch; }
  .card--mega .card-standfirst { font-size: 1.08rem; max-width: 60ch; }

  .card--large { grid-column: span 6; }
  .card--large .card-title { font-size: 1.25rem; }

  .card--medium { grid-column: span 4; }
  .card--medium .card-title { font-size: 1.05rem; }
  .card--medium .card-standfirst { display: none; }

  /* Small tier: compact row, no big media */
  .card--small {
    grid-column: span 12; flex-direction: row; align-items: center; gap: 14px;
    padding: 12px 20px;
  }
  .card--small .card-media { width: 84px; aspect-ratio: 1/1; margin-bottom: 0; flex-shrink: 0; }
  .card--small .card-media.no-image::after { font-size: 0.55rem; }
  .card--small .card-title { font-size: 0.98rem; margin-bottom: 2px; }
  .card--small .tag { margin-bottom: 3px; }

  @media (max-width: 900px) {
    .card--large { grid-column: span 6; }
    .card--medium { grid-column: span 6; }
  }
  @media (max-width: 620px) {
    .card--large { grid-column: span 12; }
    .card--medium { grid-column: span 12; }
  }

  /* ---------- Article page ---------- */

  .article-header { padding: 32px 0 20px; }
  .article-header h1 {
    font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 800; line-height: 1.18; margin: 8px 0 14px;
  }
  .article-hero-img { width: 100%; max-height: 440px; object-fit: cover; margin: 0 0 8px; }
  .article-hero-caption { font-size: 0.78rem; color: var(--muted); margin: 0 0 20px; }
  .byline { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  .article-body { padding-bottom: 60px; font-size: 1.06rem; }
  .article-body p { margin: 0 0 22px; }
  .article-body h3 { font-size: 1.3rem; font-weight: 800; margin: 38px 0 14px; }

  blockquote {
    margin: 30px 0; padding: 4px 0 4px 20px; border-left: 4px solid var(--hot);
    font-size: 1.2rem; font-weight: 600; color: var(--ink);
  }
  blockquote cite {
    display: block; margin-top: 8px; font-weight: 500;
    font-size: 0.85rem; color: var(--muted);
  }

  .back-link {
    display: inline-block; margin: 30px 0 0; font-size: 0.9rem; font-weight: 700;
    border-bottom: 2px solid var(--hot); padding-bottom: 2px;
  }
  .back-link:hover { text-decoration: none; }

  footer { border-top: 1px solid var(--rule); background: var(--bg-alt); padding: 24px 20px 40px; margin-top: 20px; }
  footer .page { font-size: 0.85rem; color: var(--muted); }

  .empty-state { padding: 60px 0; color: var(--muted); }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-inner">Fan-run drag news &amp; commentary</div></div>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="brand">
      <span class="brand-block">KIKI</span>
      <span class="brand-word">Magazine</span>
    </a>
  </div>
  <nav class="nav" id="nav">
    <a href="#/" data-route="">Home</a>
    <a href="#/category/drag-race" data-route="category/drag-race">Drag Race</a>
    <a href="#/category/lgbtq" data-route="category/lgbtq">LGBTQ</a>
    <a href="#/category/general-drag" data-route="category/general-drag">General Drag</a>
  </nav>
</header>

<main class="page" id="app">
  <div class="empty-state">Loading…</div>
</main>

<footer>
  <div class="page">
    Fan-run news and commentary. Not affiliated with World of Wonder or the BBC.
  </div>
</footer>

<script>
  let ARTICLES = [];

  const CATEGORIES = {
    "drag-race": { label: "Drag Race", cls: "cat-dragrace" },
    "lgbtq": { label: "LGBTQ", cls: "cat-lgbtq" },
    "general-drag": { label: "General Drag", cls: "cat-generaldrag" }
  };

  async function loadArticles() {
    const res = await fetch('articles.json');
    ARTICLES = await res.json();
    render();
  }

  function catInfo(slug) {
    return CATEGORIES[slug] || { label: slug, cls: "" };
  }

  function tierFor(rating) {
    if (rating >= 9) return 'mega';
    if (rating >= 7) return 'large';
    if (rating >= 4) return 'medium';
    return 'small';
  }

  function mediaHtml(article, cat) {
    if (article.image) {
      return `<div class="card-media"><img src="${article.image}" alt=""></div>`;
    }
    return `<div class="card-media no-image ${cat.cls}"></div>`;
  }

  function cardHtml(article) {
    const tier = tierFor(article.rating);
    const cat = catInfo(article.category);
    const showStandfirst = tier === 'mega' || tier === 'large';
    return `
      <a class="card ${cat.cls} card--${tier}" href="#/story/${article.slug}">
        ${mediaHtml(article, cat)}
        <div class="card-text">
          <span class="tag">${cat.label}</span>
          <h2 class="card-title">${article.title}</h2>
          ${showStandfirst ? `<p class="card-standfirst">${article.standfirst}</p>` : ''}
          <p class="card-meta">${article.date}</p>
        </div>
      </a>`;
  }

  function renderGrid(list) {
    const sorted = [...list].sort((a, b) => (b.rating || 0) - (a.rating || 0));
    return `<div class="story-grid">${sorted.map(cardHtml).join('')}</div>`;
  }

  function renderHome() {
    if (!ARTICLES.length) return `<div class="empty-state">No stories yet — add one to articles.json.</div>`;
    return renderGrid(ARTICLES);
  }

  function renderCategory(catSlug) {
    const cat = catInfo(catSlug);
    const list = ARTICLES.filter(a => a.category === catSlug);
    const heading = `<h1 class="section-heading">${cat.label}</h1>`;
    if (!list.length) return heading + `<div class="empty-state">No stories in ${cat.label} yet.</div>`;
    return heading + renderGrid(list);
  }

  function renderBody(blocks) {
    return blocks.map(block => {
      if (block.type === 'p') return `<p>${block.text}</p>`;
      if (block.type === 'h3') return `<h3>${block.text}</h3>`;
      if (block.type === 'quote') return `<blockquote>${block.text}<cite>${block.cite}</cite></blockquote>`;
      return '';
    }).join('\n');
  }

  function renderArticle(slug) {
    const a = ARTICLES.find(x => x.slug === slug);
    if (!a) return `<div class="empty-state">Story not found. <a href="#/">Back to all stories</a></div>`;
    const cat = catInfo(a.category);
    const heroImg = a.image ? `<img class="article-hero-img" src="${a.image}" alt="">` : '';
    return `
      <div class="article-col">
        ${heroImg}
        <div class="article-header ${cat.cls}">
          <span class="tag">${cat.label}</span>
          <h1>${a.title}</h1>
          <p class="byline">Published ${a.date}</p>
        </div>
        <div class="article-body">
          ${renderBody(a.body)}
        </div>
        <a class="back-link" href="#/">&larr; Back to all stories</a>
      </div>`;
  }

  function setActiveNav(route) {
    document.querySelectorAll('#nav a').forEach(link => {
      link.classList.toggle('active', link.dataset.route === route);
    });
  }

  function render() {
    const app = document.getElementById('app');
    const hash = location.hash.replace(/^#\/?/, '');

    if (hash.startsWith('story/')) {
      const slug = hash.slice('story/'.length);
      app.innerHTML = renderArticle(slug);
      const a = ARTICLES.find(x => x.slug === slug);
      document.title = a ? `${a.title} — KIKI Magazine` : 'Not found — KIKI Magazine';
      setActiveNav('');
    } else if (hash.startsWith('category/')) {
      const catSlug = hash.slice('category/'.length);
      app.innerHTML = renderCategory(catSlug);
      document.title = `${catInfo(catSlug).label} — KIKI Magazine`;
      setActiveNav(hash);
    } else {
      app.innerHTML = renderHome();
      document.title = 'KIKI Magazine — Drag Race, LGBTQ & drag news';
      setActiveNav('');
    }
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);
  loadArticles();
</script>

</body>
</html>
